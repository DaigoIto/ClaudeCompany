# ===== ネットワーク =====
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ===== ライセンスキー (https://keymaster.fivem.net で取得して貼り付け) =====
sv_licenseKey "ここにライセンスキー"

# ===== サーバー情報 =====
sv_hostname "kanimiso World"
