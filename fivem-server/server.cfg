sets sv_projectDesc "オリジナルワールドのFiveMサーバー"
sets locale "ja-JP"
sets tags "world, custom, japanese"
sv_maxclients 8
sv_enforceGameBuild 3258
set steam_webApiKey ""
sv_scriptHookAllowed 0
set onesync on

